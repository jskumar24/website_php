<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>Sign In — TS-12 Attendance System</title>
  <!-- Local MDI icons only — no Google Fonts, no CDN, works offline/file:// -->
  <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
  <link rel="shortcut icon" href="assets/images/favicon.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --brand:  #4B49AC;
      --brand2: #7b79d4;
      --text:   #1a1a3e;
      --muted:  #8888bb;
    }
    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
      background: #f0f0fa;
    }
    .page-bg {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(ellipse 70% 60% at 15% 20%, rgba(75,73,172,.18) 0%, transparent 55%),
        radial-gradient(ellipse 60% 70% at 85% 80%, rgba(123,121,212,.14) 0%, transparent 55%),
        linear-gradient(155deg, #ecebff 0%, #f5f5ff 50%, #e8e8f5 100%);
    }
    .page-bg::after {
      content:'';
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(75,73,172,.07) 1px, transparent 1px);
      background-size: 26px 26px;
    }
    .page {
      position: relative; z-index: 10;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 1.5rem;
    }
    .card {
      width: 100%; max-width: 410px;
      background: #fff;
      border-radius: 20px;
      border: 1px solid rgba(75,73,172,.14);
      box-shadow: 0 2px 8px rgba(75,73,172,.08), 0 16px 48px rgba(75,73,172,.15);
      overflow: hidden;
      animation: cardIn .4s ease both;
    }
    @keyframes cardIn { from { opacity:0; transform:translateY(22px); } to { opacity:1; transform:none; } }
    .c-header {
      background: linear-gradient(135deg, #4B49AC 0%, #7b79d4 100%);
      padding: 2rem 2rem 1.6rem;
      text-align: center;
      position: relative;
    }
    .c-header::after {
      content:'';
      position: absolute; bottom:-16px; left:0; right:0;
      height: 32px;
      background: #fff;
      border-radius: 50% 50% 0 0 / 100% 100% 0 0;
    }
    .icon-circle {
      width:64px; height:64px; border-radius:50%;
      background: rgba(255,255,255,.18);
      border: 2px solid rgba(255,255,255,.35);
      display:flex; align-items:center; justify-content:center;
      margin: 0 auto .85rem;
      font-size: 1.85rem; color:#fff;
    }
    .c-header h1 { font-size:1.25rem; font-weight:700; color:#fff; margin-bottom:.2rem; }
    .c-header p  { color:rgba(255,255,255,.78); font-size:.78rem; }
    .c-body { padding: 2.2rem 2rem 1.8rem; }
    .err {
      display:none; align-items:center; gap:.45rem;
      padding:.6rem .85rem;
      background:#fff2f0; border:1.5px solid #ffc5b8; border-radius:10px;
      margin-bottom:1rem;
      font-size:.8rem; font-weight:600; color:#c0392b;
    }
    .err.show { display:flex; }
    .field { margin-bottom:1rem; }
    .field label {
      display:block; font-size:.68rem; font-weight:700;
      text-transform:uppercase; letter-spacing:.07em;
      color:var(--muted); margin-bottom:.36rem;
    }
    .field-wrap { position:relative; }
    .f-icon {
      position:absolute; left:12px; top:50%; transform:translateY(-50%);
      font-size:1rem; color:var(--brand2); pointer-events:none;
    }
    .field-wrap input {
      width:100%;
      padding:.68rem .95rem .68rem 2.4rem;
      border:1.5px solid #dde0f5; border-radius:11px;
      font-family:inherit; font-size:.9rem; font-weight:600;
      color:var(--text); background:#fafaff; outline:none;
      transition:border-color .15s, box-shadow .15s, background .15s;
    }
    .field-wrap input:focus {
      border-color:var(--brand); background:#fff;
      box-shadow:0 0 0 3px rgba(75,73,172,.12);
    }
    .field-wrap input::placeholder { color:#bbb; font-weight:400; }
    .eye {
      position:absolute; right:11px; top:50%; transform:translateY(-50%);
      background:none; border:none; cursor:pointer;
      color:var(--muted); padding:3px 5px; border-radius:6px;
      font-size:.9rem; transition:color .15s;
    }
    .eye:hover { color:var(--brand); }
    .btn-login {
      width:100%; padding:.78rem 1rem;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      color:#fff; border:none; border-radius:11px;
      font-family:inherit; font-size:.92rem; font-weight:700; cursor:pointer;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
      box-shadow:0 4px 18px rgba(75,73,172,.38);
      transition:transform .15s, box-shadow .15s;
    }
    .btn-login:hover:not(:disabled) { transform:translateY(-2px); box-shadow:0 8px 26px rgba(75,73,172,.45); }
    .btn-login:disabled { opacity:.65; cursor:not-allowed; transform:none; }
    .spin {
      width:14px; height:14px;
      border:2px solid rgba(255,255,255,.4); border-top-color:#fff;
      border-radius:50%; animation:spin .55s linear infinite;
    }
    @keyframes spin { to { transform:rotate(360deg); } }
    .note { margin-top:1.1rem; text-align:center; font-size:.73rem; color:var(--muted); line-height:1.65; }
    .note strong { color:var(--brand); }
    .chips { display:flex; flex-wrap:wrap; justify-content:center; gap:.3rem; margin-top:.55rem; }
    .chip {
      font-size:.62rem; font-weight:700; text-transform:uppercase;
      letter-spacing:.05em; padding:2px 9px; border-radius:20px; border:1.5px solid;
    }
    .chip.p { color:#6c5ce7; border-color:#d9d6fb; background:#f5f4ff; }
    .chip.z { color:#00b894; border-color:#b2f0e4; background:#f0fdf9; }
    .chip.c { color:#0984e3; border-color:#b3d9f7; background:#f0f8ff; }
    .chip.d { color:#e17055; border-color:#f9c9be; background:#fff5f2; }
    .chip.n { color:#636e72; border-color:#d3d7d8; background:#f7f8f8; }
  </style>
  <link rel="stylesheet" href="assets/css/ts12-mobile.css">
</head>
<body>
  <div class="page-bg"></div>
  <div class="page">
    <div class="card">

      <div class="c-header">
        <div class="icon-circle"><i class="mdi mdi-meditation"></i></div>
        <h1>TS-12 Attendance System</h1>
        <p>Heartfulness Zone &mdash; Secure Sign In</p>
      </div>

      <div class="c-body">
        <div class="err" id="errBanner">
          <i class="mdi mdi-alert-circle-outline"></i>
          <span id="errMsg">Invalid credentials.</span>
        </div>

        <div class="field">
          <label for="fSrcm">SRCM ID</label>
          <div class="field-wrap">
            <i class="mdi mdi-card-account-details-outline f-icon"></i>
            <input type="text" id="fSrcm" placeholder="e.g.  INALAB103"
                   autocomplete="off" spellcheck="false" autocapitalize="characters">
          </div>
        </div>

        <div class="field">
          <label for="fPwd">Password &nbsp;<span style="font-weight:400;text-transform:none;letter-spacing:0;">(enter your SRCM ID)</span></label>
          <div class="field-wrap">
            <i class="mdi mdi-lock-outline f-icon"></i>
            <input type="password" id="fPwd" placeholder="Same as your SRCM ID">
            <button class="eye" type="button" id="eyeBtn" tabindex="-1">
              <i class="mdi mdi-eye-outline" id="eyeIcon"></i>
            </button>
          </div>
        </div>

        <button class="btn-login" id="loginBtn" onclick="doLogin()">
          <i class="mdi mdi-login-variant"></i> Sign In
        </button>

        <div class="note">
          Login is for authorised volunteers only.<br>
          <strong>Your password is your SRCM ID.</strong>
          <div class="chips">
            <span class="chip p">Preceptor</span>
            <span class="chip z">ZC</span>
            <span class="chip c">CC</span>
            <span class="chip d">DC</span>
            <span class="chip n">NC</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    /* ── PHP backend path (login.html lives in src/, backend is in src/pages/backend/) ── */
    var AUTH_URL = "pages/backend/auth_api.php";

    /* Redirect if already logged in */
    (function () {
      try {
        var u = JSON.parse(localStorage.getItem("ts12_user") || "null");
        if (u && u.srcm_id) window.location.replace("index.html");
      } catch (e) {}
    })();

    function showErr(msg) {
      document.getElementById("errMsg").textContent = msg;
      document.getElementById("errBanner").classList.add("show");
    }
    function hideErr() { document.getElementById("errBanner").classList.remove("show"); }

    document.getElementById("eyeBtn").addEventListener("click", function () {
      var inp  = document.getElementById("fPwd");
      var icon = document.getElementById("eyeIcon");
      var show = inp.type === "password";
      inp.type       = show ? "text" : "password";
      icon.className = show ? "mdi mdi-eye-off-outline" : "mdi mdi-eye-outline";
    });

    ["fSrcm","fPwd"].forEach(function (id) {
      document.getElementById(id).addEventListener("keydown", function (e) {
        if (e.key === "Enter") doLogin();
      });
    });

    async function doLogin() {
      var srcmId = document.getElementById("fSrcm").value.trim().toUpperCase();
      var pwd    = document.getElementById("fPwd").value.trim().toUpperCase();
      var btn    = document.getElementById("loginBtn");
      hideErr();

      if (!srcmId) { showErr("Please enter your SRCM ID."); return; }
      if (!pwd)    { showErr("Please enter your password."); return; }
      if (srcmId !== pwd) { showErr("Password must match your SRCM ID exactly."); return; }

      btn.disabled = true;
      btn.innerHTML = '<div class="spin"></div> Signing in\u2026';

      try {
        var res = await fetch(AUTH_URL, {
          method : "POST",
          headers: { "Content-Type": "application/json" },
          body   : JSON.stringify({ srcm_id: srcmId })
        });

        /* Handle non-JSON responses (PHP fatal errors, 404s, etc.) */
        var contentType = res.headers.get("content-type") || "";
        var data;
        if (contentType.includes("application/json")) {
          data = await res.json();
        } else {
          var text = await res.text();
          var match = text.match(/<b>(?:Fatal error|Parse error|Warning)[^<]*/i);
          throw new Error(match ? match[0].replace(/<[^>]+>/g, "") : "Server returned HTTP " + res.status + ". Check that auth_api.php is in src/pages/backend/.");
        }

        if (!res.ok || !data.success) {
          showErr(data.error || "Login failed. Please try again."); return;
        }

        localStorage.setItem("ts12_user", JSON.stringify({
          srcm_id  : data.srcm_id,
          name     : data.name,
          roles    : data.roles,
          roleLevel: data.role_level,
          canDelete: data.can_delete
        }));
        window.location.replace("index.html");

      } catch (err) {
        showErr(err.message || "Cannot reach PHP backend. Ensure php -S localhost:8080 is running from the TS12_Attend/ root folder.");
      } finally {
        btn.disabled = false;
        btn.innerHTML = '<i class="mdi mdi-login-variant"></i> Sign In';
      }
    }
  </script>
</body>
</html>
